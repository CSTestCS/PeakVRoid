name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build and package
        run: dotnet build src/PeakVRoid/PeakVRoid.csproj -c Release -t:Package
      - name: Build parser check
        run: dotnet build tests/VrmParseCheck/VrmParseCheck.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: PeakVRoid
          path: dist/*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
